name: Direct CLI Provider Check

on:
  push:
    branches:
      - forge/muse-command-direct-cli

permissions:
  contents: read

jobs:
  focused-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Direct provider tests
        run: >-
          vp test run
          apps/server/src/provider/Layers/MuseAdapter.test.ts
          apps/server/src/provider/Layers/CommandCodeAdapter.test.ts
          apps/server/src/provider/Layers/DirectCliAdapter.process.test.ts
          apps/server/src/provider/builtInDrivers.test.ts

      - name: Contracts typecheck
        run: vp run --filter @t3tools/contracts typecheck

      - name: Server typecheck
        run: vp run --filter t3 typecheck

      - name: Web typecheck
        run: vp run --filter @t3tools/web typecheck
