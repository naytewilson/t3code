name: Temporary Muse ACP cloud port

on:
  push:
    branches:
      - forge/muse-code-msp-provider

permissions:
  contents: write

jobs:
  port-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current isolated Muse branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate

      - name: Apply authoritative upstream generic-ACP PR diff
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/pingdotgg/t3code/pull/9242.diff -o /tmp/acp.diff
          grep '^diff --git ' /tmp/acp.diff | sed 's#diff --git a/##; s# b/.*##' > /tmp/acp-files.txt
          echo '=== authoritative PR files ==='
          cat /tmp/acp-files.txt

          set +e
          git apply --reject --whitespace=nowarn /tmp/acp.diff
          apply_status=$?
          set -e

          mapfile -t rejects < <(find . -name '*.rej' -print | sort)
          expected=(
            './apps/server/src/provider/Layers/CursorAdapter.ts.rej'
            './apps/server/src/provider/Layers/ProviderRegistry.ts.rej'
            './apps/web/src/components/chat/providerIconUtils.ts.rej'
          )
          if [[ ${#rejects[@]} -ne ${#expected[@]} ]]; then
            printf 'Unexpected reject count: %s\n' "${#rejects[@]}" >&2
            printf '%s\n' "${rejects[@]}" >&2
            exit 21
          fi
          for i in "${!expected[@]}"; do
            if [[ "${rejects[$i]}" != "${expected[$i]}" ]]; then
              echo "Unexpected reject: ${rejects[$i]} (expected ${expected[$i]})" >&2
              exit 21
            fi
          done

          node <<'NODE'
          const fs = require('node:fs');
          function read(path) { return fs.readFileSync(path, 'utf8'); }
          function write(path, source) { fs.writeFileSync(path, source); }
          function replaceOnce(source, before, after, label) {
            const first = source.indexOf(before);
            if (first < 0) throw new Error(`missing ${label}`);
            if (source.indexOf(before, first + before.length) >= 0) throw new Error(`ambiguous ${label}`);
            return source.slice(0, first) + after + source.slice(first + before.length);
          }

          {
            const path = 'apps/server/src/provider/Layers/CursorAdapter.ts';
            let s = read(path);
            s = replaceOnce(s, 'const PROVIDER = ProviderDriverKind.make("cursor");', 'const CURSOR_PROVIDER = ProviderDriverKind.make("cursor");', 'Cursor provider constant');
            s = replaceOnce(s, '    readonly environment?: NodeJS.ProcessEnv;\n  },', '    readonly environment?: NodeJS.ProcessEnv;\n    readonly runtimeMode?: RuntimeMode;\n  },', 'ACP runtime factory environment field');
            s = replaceOnce(s, '          let ctx!: CursorSessionContext;\n\n          const resumeSessionId = parseCursorResume(input.resumeCursor)?.sessionId;', '          let ctx!: AcpSessionContext;\n\n          const resumeSessionId = hasCursorExtensions\n            ? parseCursorResume(input.resumeCursor)?.sessionId\n            : undefined;', 'Cursor session context/resume block');
            const staleSettings = [
              '          // Resolve the CursorSettings used to spawn the ACP child. Production',
              '          // leaves `options.resolveSettings` undefined so we use the value',
              '          // captured at adapter construction — per-instance isolation is',
              '          // enforced by the hydration layer rebuilding this adapter whenever',
              '          // its config changes. Tests set `resolveSettings` to pull the latest',
              '          // snapshot from `ServerSettingsService` so that mid-suite',
              '          // `updateSettings({ providers: { cursor: { binaryPath } } })` calls',
              '          // actually take effect when the next session spawns.',
              '          const effectiveCursorSettings = options?.resolveSettings',
              '            ? yield* options.resolveSettings',
              '            : cursorSettings;',
              '',
            ].join('\n');
            s = replaceOnce(s, staleSettings, '', 'legacy Cursor settings block');
            s = replaceOnce(s, '          const acp = yield* makeCursorAcpRuntime({\n            cursorSettings: effectiveCursorSettings,', '          const acp = yield* makeRuntime({', 'Cursor runtime constructor');
            s = replaceOnce(s, '            clientInfo: { name: "t3-code", version: "0.0.0" },\n            ...(mcpSession', '            clientInfo: { name: "t3-code", version: "0.0.0" },\n            ...(profile.onConfigOptionsChanged\n              ? { onConfigOptionsChanged: profile.onConfigOptionsChanged }\n              : {}),\n            ...(profile.onAvailableCommandsChanged\n              ? { onAvailableCommandsChanged: profile.onAvailableCommandsChanged }\n              : {}),\n            ...(mcpSession', 'ACP runtime callbacks');
            s = replaceOnce(s, '          if (input.attachments && input.attachments.length > 0) {\n            for (const attachment of input.attachments) {\n              // Cursor ingests images only. Generic files reach the agent', '          if (ctx.supportsImages && input.attachments && input.attachments.length > 0) {\n            for (const attachment of input.attachments) {\n              // ACP embeds images only. Generic files reach the agent', 'ACP image capability gate');
            write(path, s);
          }

          {
            const path = 'apps/server/src/provider/Layers/ProviderRegistry.ts';
            let s = read(path);
            s = replaceOnce(s, 'const shouldRetainMissingProviderModels = (provider: ServerProvider): boolean => {\n  if (provider.driver !== ProviderDriverKind.make("opencode")) {', 'const shouldRetainMissingProviderModels = (provider: ServerProvider): boolean => {\n  if (provider.driver === ProviderDriverKind.make("acp")) {\n    return provider.enabled && provider.installed && provider.status !== "ready";\n  }\n  if (provider.driver !== ProviderDriverKind.make("opencode")) {', 'ACP provider model retention rule');
            write(path, s);
          }

          {
            const path = 'apps/web/src/components/chat/providerIconUtils.ts';
            let s = read(path);
            s = replaceOnce(s, 'import { ClaudeAI, CursorIcon, GrokIcon, Icon, OpenAI, OpenCodeIcon } from "../Icons";', 'import { ACPRegistryIcon, ClaudeAI, CursorIcon, GrokIcon, Icon, OpenAI, OpenCodeIcon } from "../Icons";', 'ACP icon import');
            s = replaceOnce(s, 'export const PROVIDER_ICON_BY_PROVIDER: Partial<Record<ProviderDriverKind, Icon>> = {\n  [ProviderDriverKind.make("codex")]: OpenAI,', 'export const PROVIDER_ICON_BY_PROVIDER: Partial<Record<ProviderDriverKind, Icon>> = {\n  [ProviderDriverKind.make("acp")]: ACPRegistryIcon,\n  [ProviderDriverKind.make("codex")]: OpenAI,', 'ACP icon map');
            write(path, s);
          }
          NODE

          rm -f "${rejects[@]}"
          find . -name '*.orig' -delete
          if [[ $apply_status -eq 0 ]]; then
            echo 'Expected current-upstream overlap rejects, but git apply returned success.' >&2
            exit 22
          fi
          git diff --check
          git status --short

      - name: Install exact T3 dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck server
        run: pnpm --filter ./apps/server typecheck

      - name: Run ACP and driver tests
        working-directory: apps/server
        run: pnpm exec vp test run src/provider/acp src/provider/Layers/CursorAdapter.test.ts src/provider/Drivers

      - name: Run effect-acp tests
        working-directory: packages/effect-acp
        run: pnpm exec vp test run src

      - name: Remove temporary workflow and publish verified port
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/muse-acp-cloud-port.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(provider): port generic ACP stack onto current T3'
          git push origin HEAD:forge/muse-code-msp-provider
